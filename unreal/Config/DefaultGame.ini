[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=PoseOscUnreal
Description=Webcam pose -> OSC -> state machine -> Niagara (interview mini project)

[/Script/PoseOscUnreal.PoseOscReceiverComponent]
; DESIGN_DECISIONS D3 change: the engine OSC plugin rebinds 127.0.0.1 to the LAN IP, so bind the wildcard and
; accept only localhost senders. To run inference on another PC, add its IP (e.g. +AllowedSenderAddresses=192.168.0.20).
ListenAddress=0.0.0.0
ListenPort=8000
+AllowedSenderAddresses=127.0.0.1

[/Script/PoseOscUnreal.PoseNiagaraDriverComponent]
; Used when the actor's Niagara component has no asset (e.g. the actor auto-spawned on the empty map).
DefaultSystem=/Game/FX/NS_PoseHands.NS_PoseHands
